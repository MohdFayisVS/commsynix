name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install Node.js 🟢
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies 🔧
        run: npm ci

      - name: Build Project 🏗️
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Debug Output Structure 🔍
        run: |
          echo "=== Root Files ==="
          ls -la
          echo "=== Output Folder (if exists) ==="
          if [ -d .output ]; then find .output; else echo ".output does not exist"; fi
          echo "=== Dist Folder (if exists) ==="
          if [ -d dist ]; then find dist; else echo "dist does not exist"; fi

      - name: Setup SPA Routing & Prepare Deploy Folder 🔄
        run: |
          mkdir -p deploy_out
          if [ -d .output/public ]; then
            cp -r .output/public/* deploy_out/
          elif [ -d dist ]; then
            cp -r dist/* deploy_out/
          else
            echo "Error: Neither .output/public nor dist was found!"
            exit 1
          fi
          
          if [ -f deploy_out/_shell.html ]; then
            cp deploy_out/_shell.html deploy_out/index.html
            cp deploy_out/_shell.html deploy_out/404.html
          elif [ -f deploy_out/index.html ]; then
            cp deploy_out/index.html deploy_out/404.html
          else
            echo "Error: Neither _shell.html nor index.html was found in deploy folder!"
            exit 1
          fi

      - name: Upload Artifact 📦
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy_out

      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
