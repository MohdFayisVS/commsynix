name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install Node.js 🟢
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies 🔧
        run: npm ci

      - name: Build Project 🏗️
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Setup SPA Routing for GitHub Pages 🔄
        run: |
          if [ -f .output/public/_shell.html ]; then
            cp .output/public/_shell.html .output/public/index.html
            cp .output/public/_shell.html .output/public/404.html
          elif [ -f .output/public/index.html ]; then
            cp .output/public/index.html .output/public/404.html
          else
            echo "Error: Neither _shell.html nor index.html was found in .output/public/"
            exit 1
          fi

      - name: Deploy to GitHub Pages 🚀
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .output/public
